<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brota — Guion de sustentación</title>
<style>
  :root{
    --bg:#F4F3EC; --surface:#FFFFFF; --surface-2:#EFEEE5;
    --ink:#15241B; --ink-soft:#67756B; --line:#E6E4DA;
    --primary:#21BD68; --primary-deep:#0E7D43; --primary-ink:#FFFFFF; --primary-soft:#E2F6EC;
    --accent:#E07A42; --accent-soft:#FBE8DC;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0C1310; --surface:#151F19; --surface-2:#1C2A22;
      --ink:#EAF3EC; --ink-soft:#94A69B; --line:#27362D;
      --primary:#34D27D; --primary-deep:#1FA862; --primary-ink:#04301C; --primary-soft:#16301F;
      --accent:#F0996A; --accent-soft:#2C2018;
    }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }

  /* ---------- Top bar ---------- */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 20px; border-bottom:1px solid var(--line); background:var(--surface);
    flex-shrink:0; gap:12px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:8px; font-weight:800; letter-spacing:-.3px;}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--primary);}
  .meta{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--ink-soft);}
  .chip{
    padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700;
    background:var(--primary-soft); color:var(--primary-deep); white-space:nowrap;
  }
  @media (prefers-color-scheme: dark){ .chip{ color:var(--primary); } }
  .chip.accent{ background:var(--accent-soft); color:var(--accent); }

  .progress-track{ height:4px; background:var(--surface-2); flex-shrink:0; }
  .progress-fill{ height:100%; background:var(--primary); width:0%; transition:width .25s ease; }

  /* ---------- Slide area ---------- */
  main{ flex:1; position:relative; overflow:hidden; }
  .slide{
    position:absolute; inset:0; display:none;
    padding:28px 8vw 90px; overflow-y:auto;
  }
  .slide.active{ display:block; }

  .badges{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .badge-block{ padding:4px 12px; border-radius:8px; font-size:12.5px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; }
  .b1{ background:var(--primary-soft); color:var(--primary-deep); }
  .b2{ background:var(--accent-soft); color:var(--accent); }
  .b3{ background:var(--surface-2); color:var(--ink-soft); }
  @media (prefers-color-scheme: dark){ .b1{color:var(--primary);} }
  .badge-time{ padding:4px 12px; border-radius:8px; font-size:12.5px; font-weight:700; background:var(--surface-2); color:var(--ink-soft); }
  .badge-speaker{ padding:4px 12px; border-radius:8px; font-size:12.5px; font-weight:800; background:var(--surface); border:1.5px solid var(--line); }

  h1.slide-title{ font-size:clamp(22px,3.4vw,38px); margin:0 0 6px; letter-spacing:-.5px; }
  .subtitle{ color:var(--ink-soft); font-size:15px; margin:0 0 22px; max-width:70ch; }

  .panel{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:18px 20px; margin-bottom:16px;
  }
  .panel h3{ margin:0 0 10px; font-size:14px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-soft); display:flex; align-items:center; gap:8px;}
  .panel p, .panel li{ font-size:16px; line-height:1.55; }
  .panel ul{ margin:0; padding-left:20px; }
  .panel.mostrar{ border-left:4px solid var(--primary); }
  .panel.decir{ border-left:4px solid var(--accent); }
  .quote{ font-style:italic; color:var(--ink); background:var(--surface-2); border-radius:10px; padding:12px 14px; margin:8px 0 0; }
  code, .code{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:14px;
    background:var(--surface-2); padding:1px 6px; border-radius:5px;
  }
  a{ color:var(--primary-deep); }
  @media (prefers-color-scheme: dark){ a{ color:var(--primary); } }

  table{ width:100%; border-collapse:collapse; font-size:14.5px; }
  th,td{ text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th{ color:var(--ink-soft); font-weight:700; font-size:12.5px; text-transform:uppercase; letter-spacing:.3px; }

  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  @media (max-width:820px){ .grid3{ grid-template-columns:1fr; } }
  .person-card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .person-card h4{ margin:0 0 6px; font-size:15px; }
  .person-card .tag{ font-size:11.5px; color:var(--ink-soft); }

  .callout{
    background:var(--primary-soft); border-radius:12px; padding:14px 16px; font-size:15px;
    margin-top:6px;
  }
  .callout.warn{ background:var(--accent-soft); }

  .cover{ display:flex; flex-direction:column; justify-content:center; align-items:flex-start; height:100%; max-width:900px; margin:0 auto; }
  .cover .dotgrid{ display:flex; gap:8px; margin-bottom:18px; }
  .cover .dotgrid span{ width:12px; height:12px; border-radius:50%; background:var(--primary); opacity:.85; }
  .cover .dotgrid span:nth-child(2){ background:var(--accent); }
  .cover .dotgrid span:nth-child(3){ background:var(--ink-soft); }
  .cover h1{ font-size:clamp(34px,6vw,64px); margin:0 0 10px; letter-spacing:-1.5px; }
  .cover .lead{ font-size:19px; color:var(--ink-soft); margin:0 0 28px; max-width:60ch; }
  .timebar{ display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; }
  .timebar div{ padding:10px 16px; border-radius:12px; background:var(--surface); border:1px solid var(--line); font-weight:700; font-size:14px; }
  .timebar div b{ display:block; font-size:20px; color:var(--primary); }
  @media (prefers-color-scheme: dark){ .timebar div b{ color:var(--primary); } }

  /* ---------- Footer / nav ---------- */
  footer{
    position:fixed; bottom:0; left:0; right:0; display:flex; align-items:center; justify-content:space-between;
    padding:12px 20px; background:var(--surface); border-top:1px solid var(--line); z-index:5;
  }
  .nav-btns{ display:flex; gap:8px; }
  button{
    font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--surface);
    color:var(--ink); padding:9px 16px; border-radius:10px; font-weight:700; font-size:14px;
  }
  button:hover{ border-color:var(--primary); }
  button.primary{ background:var(--primary); color:var(--primary-ink); border-color:var(--primary); }
  button:disabled{ opacity:.35; cursor:default; }
  #counter{ font-size:13px; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
  .accum{ font-size:13px; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
</style>
</head>
<body>

<header>
  <div class="brand"><span class="dot"></span> Brota — Guion de sustentación</div>
  <div class="meta">
    <span class="chip">15 min netos</span>
    <span class="chip accent">Seguridad 5' · Arquitectura 7' · Ágil 3'</span>
    <span id="counter"></span>
  </div>
</header>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

<main id="slides"></main>

<footer>
  <div class="nav-btns">
    <button id="prevBtn">← Anterior</button>
    <button id="nextBtn" class="primary">Siguiente →</button>
  </div>
  <div class="accum" id="accum"></div>
</footer>

{ block:'b1', badge:'Bloque 1 · Seguridad', time:'3:15 – 4:15', speaker:'David', title:'Guard de rol en el frontend + el bug que corregimos', body:`

{ block:'b1', badge:'Bloque 1 · Seguridad', time:'4:15 – 5:00', speaker:'David', title:'Contraseñas y el matiz del "JWT propio"', body:`

`},

`},

];

/* ===================== RENDER ===================== */
const root = document.getElementById('slides');
let idx = 0;

function timeToSec(range){
  if(!range) return null;
  const end = range.split('–').pop().trim();
  const [m,s] = end.split(':').map(Number);
  return m*60 + s;
}

SLIDES.forEach((s, i) => {
  const div = document.createElement('section');
  div.className = 'slide' + (i===0 ? ' active' : '');
  if(s.cover){
    div.innerHTML = s.html;
  } else {
    div.innerHTML = `
      <div class="badges">
        ${s.badge ? `<span class="badge-block ${s.block||''}">${s.badge}</span>` : ''}
        ${s.time ? `<span class="badge-time">⏱ ${s.time}</span>` : ''}
        ${s.speaker ? `<span class="badge-speaker">🎤 ${s.speaker}</span>` : ''}
      </div>
      <h1 class="slide-title">${s.title}</h1>
      ${s.sub ? `<p class="subtitle">${s.sub}</p>` : ''}
      ${s.body}
    `;
  }
  root.appendChild(div);
});

const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const counter = document.getElementById('counter');
const accum = document.getElementById('accum');
const fill = document.getElementById('progressFill');
const slideEls = document.querySelectorAll('.slide');

function render(){
  slideEls.forEach((el,i) => el.classList.toggle('active', i===idx));
  prevBtn.disabled = idx===0;
  nextBtn.disabled = idx===slideEls.length-1;
  counter.textContent = `${idx+1} / ${slideEls.length}`;
  fill.style.width = `${((idx+1)/slideEls.length)*100}%`;
  const t = SLIDES[idx].time;
  if(t){
    const sec = timeToSec(t);
    const mm = String(Math.floor(sec/60)).padStart(2,'0');
    const ss = String(sec%60).padStart(2,'0');
    accum.textContent = `Acumulado hasta esta diapositiva: ${mm}:${ss} / 15:00`;
  } else {
    accum.textContent = '';
  }
  slideEls[idx].scrollTop = 0;
}

prevBtn.addEventListener('click', () => { if(idx>0){ idx--; render(); } });
nextBtn.addEventListener('click', () => { if(idx<slideEls.length-1){ idx++; render(); } });
document.addEventListener('keydown', (e) => {
  if(e.key==='ArrowRight' || e.key===' '){ e.preventDefault(); if(idx<slideEls.length-1){ idx++; render(); } }
  if(e.key==='ArrowLeft'){ if(idx>0){ idx--; render(); } }
});

render();
</script>
</body>
</html>
