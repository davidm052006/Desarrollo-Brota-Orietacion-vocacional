name: CI

# Corre en todos los PR (contra cualquier rama base) y en push a develop/main,
# para que el estado de esas dos ramas siempre sea visible en GitHub aunque
# alguien pushee directo (ver branch protection: solo David puede pushear
# directo a main).
on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml
            e2e/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter backend exec eslint .

      # backend/.env.example trae credenciales reales de desarrollo a propósito
      # (ver CLAUDE.md, "Credenciales reales expuestas en el repo" — decisión
      # consciente para la fase de desarrollo) así que sirven tal cual para CI,
      # sin necesitar GitHub Secrets todavía.
      - name: Preparar variables de entorno
        working-directory: backend
        run: cp .env.example .env

      - name: Tests
        run: pnpm --filter backend test

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml
            e2e/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter frontend lint

      - name: Tests
        run: pnpm --filter frontend test

      - name: Preparar variables de entorno
        working-directory: frontend
        run: cp .env.local.example .env.local

      - name: Build
        run: pnpm --filter frontend build
