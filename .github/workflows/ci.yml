name: CI

# Corre en todos los PR (contra cualquier rama base) y en push a develop/main,
# para que el estado de esas dos ramas siempre sea visible en GitHub aunque
# alguien pushee directo (ver branch protection: solo David puede pushear
# directo a main).
on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml
            e2e/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter backend exec eslint .

      # backend/.env.example apunta a la Supabase local con sus claves de
      # demostración (públicas). Los tests unitarios y de API usan un Supabase
      # simulado, y los de integración se saltan sin DATABASE_URL, así que
      # nada de esto se conecta de verdad.
      - name: Preparar variables de entorno
        working-directory: backend
        run: cp .env.example .env

      - name: Tests y cobertura
        run: pnpm --filter backend test:coverage

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml
            e2e/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter frontend lint

      - name: Tests y cobertura
        run: pnpm --filter frontend test:coverage

      - name: Preparar variables de entorno
        working-directory: frontend
        run: cp .env.local.example .env.local

      - name: Build
        run: pnpm --filter frontend build

  e2e:
    name: Browser E2E (login validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml
            e2e/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Instalar Chromium
        run: pnpm --dir e2e exec playwright install --with-deps chromium

      # login-route.spec.js necesita VITE_SUPABASE_URL para que la app no entre
      # en modo demo; igual nunca llega a Supabase: page.route corta y simula
      # todas las peticiones a *.supabase.co. Por eso se usa una URL ficticia de
      # ese dominio (la misma de e2e/run-tests.mjs) y no la Supabase local del
      # .env.local.example, que en CI no está corriendo.
      - name: Preparar variables de entorno del frontend
        working-directory: frontend
        run: |
          {
            echo "VITE_SUPABASE_URL=https://example.supabase.co"
            echo "VITE_SUPABASE_ANON_KEY=e2e-public-test-key"
            echo "VITE_API_URL=http://localhost:3001"
          } > .env.local

      - name: E2E sin credenciales externas
        run: pnpm --dir e2e exec playwright test tests/login-validation.spec.js tests/login-route.spec.js
